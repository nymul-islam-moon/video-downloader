[project]
name = "video-downloader"
version = "0.1.0"
description = "Download multiple videos using yt-dlp"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "yt-dlp>=2025.1.0"
]

[project.scripts]
download-videos = "downloader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/downloader"]
